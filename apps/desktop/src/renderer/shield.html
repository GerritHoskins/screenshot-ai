<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Review capture</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      :root {
        --bg: #f6f6f4;
        --surface: #ffffff;
        --surface-2: #f0f0ec;
        --border: #e2e2dc;
        --border-strong: #cbcbc3;
        --ink: #1a1b1e;
        --ink-2: #45474d;
        --ink-3: #686b72;
        --accent: #2a46c4;
        --accent-hover: #2139a6;
        --accent-press: #1b2f8a;
        --accent-tint: #eef1fc;
        --sev-med: #8a5300;
        --sev-med-bg: #fdf2df;
        --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
        --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --radius: 6px;
        --on-accent: #ffffff;
        color-scheme: light dark;
      }
      /* Dark theme: same tokens as the main and settings windows. */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191917; --surface: #20201e; --surface-2: #2a2a27; --border: #363632; --border-strong: #52524b;
          --ink: #ececea; --ink-2: #c4c4be; --ink-3: #a2a29b;
          --accent: #8fa2f0; --accent-hover: #a6b5f3; --accent-press: #bcc8f6; --accent-tint: #252b45; --on-accent: #111318;
          --sev-med: #e8b768; --sev-med-bg: #362b18;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column;
        background: var(--bg); color: var(--ink);
        font-family: var(--font-sans); font-size: 13px; line-height: 1.45;
      }
      header { padding: 14px 20px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .sub { margin: 2px 0 0; color: var(--ink-2); }
      .reason { margin: 6px 0 0; color: var(--ink-2); }
      .reason q { color: var(--ink); }
      .notice { margin: 8px 0 0; padding: 6px 10px; border-radius: var(--radius); background: var(--sev-med-bg); color: var(--sev-med); }
      .notice[hidden], .reason[hidden] { display: none; }
      main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
      .stage { position: relative; max-width: 100%; max-height: 100%; cursor: crosshair; user-select: none; touch-action: none;
               box-shadow: 0 0 0 1px var(--border-strong); background: var(--surface-2); }
      .stage img { display: block; width: 100%; height: 100%; pointer-events: none; }
      .box { position: absolute; padding: 0; border: 0; border-radius: 2px; cursor: pointer; min-width: 4px; min-height: 4px; }
      .box.covered { background: #000; }
      .box.uncovered { background: transparent; outline: 2px dashed var(--sev-med); outline-offset: -1px; }
      .box:focus-visible { box-shadow: var(--focus); }
      .box .tag { position: absolute; left: 0; bottom: 100%; margin-bottom: 2px; padding: 1px 6px; border-radius: 3px;
                  background: var(--ink); color: var(--surface); font-size: 11px; white-space: nowrap; pointer-events: none; opacity: 0; }
      .box:hover .tag, .box:focus-visible .tag { opacity: 1; }
      .draft { position: absolute; border: 2px dashed var(--accent); background: rgba(42, 70, 196, 0.15); pointer-events: none; }
      footer { display: flex; align-items: center; gap: 8px; padding: 12px 20px; background: var(--surface); border-top: 1px solid var(--border); }
      .summary { flex: 1; color: var(--ink-2); }
      button {
        display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px;
        border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink);
        font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer;
      }
      button:hover { background: var(--surface-2); }
      button:focus-visible { outline: none; box-shadow: var(--focus); }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      button.primary:active { background: var(--accent-press); }
      .stage .box { height: auto; font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Review before sending</h1>
      <p class="sub" id="subtitle">Black areas are covered and will not be sent.</p>
      <p class="reason" id="reason" hidden></p>
      <p class="notice" id="notice" role="status" hidden></p>
    </header>
    <main>
      <div class="stage" id="stage" aria-label="Capture preview. Drag to cover an area."></div>
    </main>
    <footer>
      <span class="summary" id="summary" aria-live="polite"></span>
      <button id="cancel" type="button">Cancel</button>
      <button id="send" class="primary" type="button">Send</button>
    </footer>
    <script type="module" src="shield.ts"></script>
  </body>
</html>
