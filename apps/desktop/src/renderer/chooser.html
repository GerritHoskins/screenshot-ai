<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Select Display</title>
    <link rel="stylesheet" href="fonts.css" />
    <style>
      body { margin: 16px; }
      h1 { margin: 0 0 12px 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      .card { border: 1px solid #d0d0d0; border-radius: 8px; overflow: hidden; background: #fff; }
      .thumb { width: 100%; height: 120px; background-size: cover; background-position: center; }
      .label { padding: 8px; font-size: 12px; color: #333; }
      .card button { width: 100%; padding: 8px; border: none; background: #f5f5f5; cursor: pointer; }
      .card button:hover { background: #e9e9e9; }
      .actions { margin-top: 12px; display: flex; gap: 8px; }
    </style>
  </head>
  <body>
    <h1>Select a display</h1>
    <div id="grid" class="grid"></div>
    <div class="actions">
      <button id="cancel">Cancel</button>
    </div>
    <script type="module" src="chooser.ts"></script>
  </body>
</html>
